name: Nightly Stress & Benchmarks

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM

permissions:
  contents: read

jobs:
  stress-benchmarks:
    name: Stress & Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Tests
        run: |
          chmod +x mvnw scripts/*.sh
          ./mvnw clean test-compile

      - name: Execute Extended Stress & Soak Suite
        run: ./mvnw test -Pstress -pl aegisdb-integration -Daegisdb.stress.durationSeconds=120

      - name: Run Live Demonstration & Research Benchmarks
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-stress-benchmarks.sh
          python -m pip install matplotlib
          python scripts/plot_benchmarks.py
