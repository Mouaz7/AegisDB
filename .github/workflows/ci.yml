name: CI Quality & Security Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Verify & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Verify Modules (Master Plan §13)
        run: |
          mvn clean test-compile

      - name: Execute Full Test Suite & Architecture Gates (Master Plan §11 & §14)
        run: |
          mvn test

      - name: Run Live Demonstration (Sprint 10 / US016, US017)
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-sprint10-demo.sh

      - name: Run Live Demonstration & Research Benchmarks (Sprint 11 / US018, US019)
        run: |
          ./scripts/run-sprint11-demo.sh
          python -m pip install matplotlib
          python scripts/plot_benchmarks.py

      - name: Security Hardening & Dependency Scan (Master Plan §12)
        run: |
          ./scripts/run-security-scan.sh
