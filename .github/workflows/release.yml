name: Release Package & Verification

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Package Distribution (Assembly)
        run: |
          chmod +x mvnw scripts/*.sh bin/* 2>/dev/null || true
          ./scripts/package-release.sh

      - name: Run Release Smoke Test (Unpack & Verify)
        run: |
          ./scripts/run-release-smoke-test.sh
          ./scripts/verify-release-readiness.sh

      - name: GitHub Release Publication
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/aegisdb-*-bin.tar.gz
            target/release/aegisdb-*-bin.zip
            target/release/aegisdb-*-bin.tar.gz.sha256
            target/release/aegisdb-*-bin.zip.sha256
            target/release/bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
