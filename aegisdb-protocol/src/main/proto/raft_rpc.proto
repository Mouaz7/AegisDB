syntax = "proto3";

// ============================================================================
// AegisDB Consensus & Cluster Transport Protocol Specification
//
// Compatibility & Breaking-Change Policy:
// 1. Tag numbers (field numbers) MUST NEVER be changed or reused once published.
// 2. If a field is deprecated or removed, its tag number and name MUST be added
//    to a 'reserved' statement to prevent accidental reuse.
// 3. New fields MUST be optional or added with default semantics to preserve
//    backward compatibility with older nodes in mixed-version rolling upgrades.
// 4. Do not change wire types of existing fields.
// ============================================================================

package se.mouaz.aegisdb.protocol;

option java_multiple_files = true;
option java_package = "se.mouaz.aegisdb.protocol.pb";

message RequestVoteArgs {
  string candidate_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteReply {
  int64 term = 1;
  bool vote_granted = 2;
  string reason = 3;
}

message AppendEntriesArgs {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  bytes entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  string reason = 4;
}

message InstallSnapshotArgs {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotReply {
  int64 term = 1;
  bool success = 2;
}

service RaftRpcService {
  rpc RequestVote (RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries (AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot (InstallSnapshotArgs) returns (InstallSnapshotReply);
}
