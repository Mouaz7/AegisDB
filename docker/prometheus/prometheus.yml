global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'aegisdb_cluster'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:9001'
          - 'host.docker.internal:9002'
          - 'host.docker.internal:9003'
        labels:
          cluster: 'aegisdb-local'
